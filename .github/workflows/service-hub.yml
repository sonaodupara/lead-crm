name: Service Hub CI
on:
  push:
    paths: ['service-hub/**', '.github/workflows/service-hub.yml']
  pull_request:
    paths: ['service-hub/**', '.github/workflows/service-hub.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 'service-hub/*/package-lock.json' }
      - name: API
        working-directory: service-hub/api
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/servicehub_test
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Web
        working-directory: service-hub/web
        run: |
          npm ci
          npm run build
